name: Community extensions
on:
  pull_request:
    paths: ['community-plugins/**', 'public/extensions/**', 'scripts/build-extensions.mjs', 'scripts/check-plugin-v2-boundary.mjs', 'scripts/plugin-v2-boundary.test.mjs', 'integrations/navopath-plugin-api/**', 'integrations/navopath-plugin-template/**', 'src/extensions/**', 'integrations/navopath-*-template/**', 'integrations/super-productivity-navopath/**', 'mcp-worker/src/superProductivitySync*', 'src/supabasePlannerApi.ts']
  push:
    branches: [main, desktop-beta]
    paths: ['community-plugins/**', 'public/extensions/**', 'scripts/build-extensions.mjs', 'scripts/check-plugin-v2-boundary.mjs', 'scripts/plugin-v2-boundary.test.mjs', 'integrations/navopath-plugin-api/**', 'integrations/navopath-plugin-template/**', 'src/extensions/**', 'integrations/super-productivity-navopath/**', 'mcp-worker/src/superProductivitySync*', 'src/supabasePlannerApi.ts']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-extensions.mjs --check
      - run: node --test scripts/plugin-v2-boundary.test.mjs
      - run: npx vitest run src/extensions src/widget/widgetTimer.test.ts
      - run: npm ci --prefix mcp-worker
      - run: npm run typecheck --prefix mcp-worker
      - run: npm test --prefix mcp-worker
      - run: node --test sync-bridge/bridge.test.mjs
      - run: node --check integrations/super-productivity-navopath/plugin.js
      - run: node scripts/changelog-maintain.mjs --check
      - run: npm run css:check
      - run: npm run build
      - run: npm test
