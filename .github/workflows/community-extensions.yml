name: Community extensions
on:
  pull_request:
    paths: ['community-plugins/**', 'public/extensions/**', 'scripts/build-extensions.mjs', 'src/extensions/**', 'integrations/navopath-*-template/**', 'integrations/super-productivity-navopath/**', 'mcp-worker/src/superProductivitySync*', 'src/supabasePlannerApi.ts']
  push:
    branches: [main]
    paths: ['community-plugins/**', 'public/extensions/**', 'scripts/build-extensions.mjs', 'src/extensions/**', 'integrations/super-productivity-navopath/**', 'mcp-worker/src/superProductivitySync*', 'src/supabasePlannerApi.ts']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-extensions.mjs --check
      - run: npx vitest run src/extensions src/widget/widgetTimer.test.ts
      - run: node --test mcp-worker/src/superProductivitySync.node-test.ts
      - run: node --check integrations/super-productivity-navopath/plugin.js
      - run: node scripts/changelog-maintain.mjs --check
      - run: npm run css:check
      - run: npm run build
      - run: npm test
