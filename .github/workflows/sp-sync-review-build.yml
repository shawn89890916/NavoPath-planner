name: Build SP sync review packages
on:
  push:
    branches: [feat/sp-sync-1-1-review, feat/sp-sync-1-1-beta-127]
    paths:
      - '.github/workflows/sp-sync-review-build.yml'
      - 'community-plugins/super-productivity-sync/**'
      - 'integrations/super-productivity-navopath/plugin.js'
      - 'integrations/super-productivity-navopath/manifest.json'
      - 'scripts/build-sp-sync-package.mjs'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run extensions:build
      - run: node scripts/build-sp-sync-package.mjs
      - run: node --test mcp-worker/src/superProductivitySync.node-test.ts scripts/super-productivity-companion.test.mjs
      - run: npm run extensions:check
      - name: Commit generated packages to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/extensions/packages/super-productivity-sync.navopackage.json public/extensions/catalog.json integrations/super-productivity-navopath/navopath-sync-1.1.0.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified SP Sync 1.1.0 packages'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
