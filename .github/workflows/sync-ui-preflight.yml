name: Sync plugin UI preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'community-plugins/super-productivity-sync/**'
      - 'integrations/super-productivity-navopath/**'
      - 'src/extensions/pluginSurface.ts'
      - 'mcp-worker/src/superProductivitySync.ts'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/sync-preview-and-plugin-ui-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate release files
        shell: bash
        run: |
          npm run extensions:build
          node scripts/changelog-maintain.mjs
          node scripts/changelog-maintain.mjs --check
          zip -q -j integrations/super-productivity-navopath/navopath-sync-1.0.3.zip integrations/super-productivity-navopath/index.html integrations/super-productivity-navopath/manifest.json integrations/super-productivity-navopath/LICENSE
          git diff --name-only
          printf 'NVP_SOURCE_TREE %s\n' "$(git rev-parse HEAD^{tree})"
          printf 'NVP_SOURCE_HEAD %s\n' "$(git rev-parse HEAD)"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const paths = ["public/extensions/packages/super-productivity-sync.navopackage.json", "public/extensions/catalog.json", "integrations/super-productivity-navopath/navopath-sync-1.0.3.zip"];
            for (const [i, path] of paths.entries()) {
              const bytes = readFileSync(path).toString("base64");
              for (let offset=0; offset<bytes.length; offset+=1600) console.log("NVP_GENERATED "+i+" "+offset+" "+bytes.slice(offset, offset+1600));
            }
          '
      - uses: actions/upload-artifact@v4
        with:
          name: sync-plugin-release-candidates
          path: |
            public/extensions/packages/super-productivity-sync.navopackage.json
            public/extensions/catalog.json
            integrations/super-productivity-navopath/navopath-sync-1.0.3.zip
      - run: npm run extensions:check
      - run: npm run build
      - run: npm run css:check
      - run: npm test
      - run: npm ci --prefix mcp-worker
      - run: npm run typecheck --prefix mcp-worker
      - run: npm test --prefix mcp-worker
