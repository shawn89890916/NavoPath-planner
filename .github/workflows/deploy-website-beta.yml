name: Deploy NavoPath website beta

on:
  push:
    branches: [website-beta]

permissions:
  contents: read

concurrency:
  group: navopath-website-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-worker/package-lock.json

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm exec -- vitest run src/productSite.test.ts src/productDemoData.test.ts
      - run: npm run build:navopath -- --base=/beta/ --outDir .wrangler/beta-assets/beta
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
      - run: rm .wrangler/beta-assets/beta/{_headers,_redirects,_routes.json}
      - run: npm ci --prefix mcp-worker

      - name: Deploy the beta Worker
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment credentials are missing for this GitHub Actions job."
            exit 1
          fi
          if ./mcp-worker/node_modules/.bin/wrangler deploy --config wrangler.beta.toml 2>&1 | tee "$RUNNER_TEMP/navopath-wrangler.log"; then
            exit 0
          fi
          python - "$RUNNER_TEMP/navopath-wrangler.log" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          log = re.sub(r"\[[0-9;]*m", "", Path(sys.argv[1]).read_text())
          codes = ", ".join(dict.fromkeys(re.findall(r"\[code: (\d+)\]", log)))
          area = next((label for path, label in (
              ("/workers/routes", "zone Worker routes"),
              ("/zones", "zone lookup or configuration"),
              ("/workers/scripts", "Worker script"),
              ("/workers/assets", "Worker assets"),
          ) if path in log), "deployment")
          print(f"::error::Cloudflare {area} failed. API codes: {codes or 'none reported'}.")
          PYTHON
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the public beta routes
        run: |
          for path in /beta /beta/features/workspace /beta/features/plugins /beta/features/ai /beta/principles; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              "https://navopath.com${path}" --output "$RUNNER_TEMP/navopath-beta.html"
            grep -Fq '/beta/assets/' "$RUNNER_TEMP/navopath-beta.html"
          done
