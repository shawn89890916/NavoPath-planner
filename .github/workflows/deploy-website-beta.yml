name: Deploy NavoPath website beta

on:
  push:
    branches: [website-beta]

permissions:
  contents: read

concurrency:
  group: navopath-website-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-worker/package-lock.json

      - name: Check access to the navopath.com Worker routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }
          if (!token || !account) fail("Cloudflare deployment credentials are missing for this GitHub Actions job.");
          async function request(endpoint, operation) {
            const res = await fetch(`https://api.cloudflare.com/client/v4${endpoint}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const payload = await res.json();
            if (!res.ok || !payload.success) {
              const codes = payload.errors?.map(error => Number(error.code)).filter(Number.isFinite).join(", ");
              fail(`Cloudflare ${operation} failed (HTTP ${res.status}, API codes ${codes || "none"}).`);
            }
            return payload.result;
          }
          const zones = await request(`/zones?name=navopath.com&account.id=${encodeURIComponent(account)}`, "zone lookup");
          const zone = zones.find(zone => zone.name === "navopath.com");
          if (!zone) fail("Cloudflare token cannot see the navopath.com zone in the configured account.");
          const routes = await request(`/zones/${zone.id}/workers/routes`, "Worker route listing for navopath.com");
          const beta = new Set(["navopath.com/beta", "navopath.com/beta/*"]);
          if (routes.some(route => beta.has(route.pattern) && route.script !== "navopath-website-beta")) {
            fail("An existing Worker owns one of the exact beta routes. Review it in Cloudflare before changing the route.");
          }
          NODE

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm exec -- vitest run src/productSite.test.ts src/productDemoData.test.ts
      - run: npm run build:navopath -- --base=/beta/ --outDir .wrangler/beta-assets/beta
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
      - run: rm .wrangler/beta-assets/beta/{_headers,_redirects,_routes.json}
      - run: npm ci --prefix mcp-worker

      - name: Deploy the beta Worker
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment credentials are missing for this GitHub Actions job."
            exit 1
          fi
          if ./mcp-worker/node_modules/.bin/wrangler deploy --config wrangler.beta.toml 2>&1 | tee "$RUNNER_TEMP/navopath-wrangler.log"; then
            exit 0
          fi
          python - "$RUNNER_TEMP/navopath-wrangler.log" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          log = re.sub(r"\x1b\[[0-9;]*m", "", Path(sys.argv[1]).read_text())
          codes = ", ".join(dict.fromkeys(re.findall(r"\[code:\s*(\d+)\s*\]", log)))
          area = next((label for path, label in (
              ("/workers/routes", "zone Worker routes"),
              ("/zones", "zone lookup or configuration"),
              ("/workers/scripts", "Worker script"),
              ("/workers/assets", "Worker assets"),
          ) if path in log), "deployment")
          print(f"::error::Cloudflare {area} failed. API codes: {codes or 'none reported'}.")
          PYTHON
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the public beta routes
        run: |
          for path in /beta /beta/features/workspace /beta/features/plugins /beta/features/ai /beta/principles; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              "https://navopath.com${path}" --output "$RUNNER_TEMP/navopath-beta.html"
            grep -Fq '/beta/assets/' "$RUNNER_TEMP/navopath-beta.html"
          done
