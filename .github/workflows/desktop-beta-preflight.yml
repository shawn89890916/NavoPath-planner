name: Desktop Beta preflight
on:
  push:
    branches: [desktop-beta, feat/metrics-2-desktop-beta, feat/metrics-review-beta-113, feat/metrics-history-beta-114, feat/metrics-full-history-beta-116, feat/metrics-storage-beta-117, feat/metrics-capture-beta-118, feat/metrics-breakdown-beta-119, feat/metrics-execution-beta-120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/changelog-maintain.mjs --check
      - run: node scripts/prepare-desktop-release.mjs --check-policy
      - run: npm test
      - run: node scripts/metrics-storage-browser.cjs
      - run: npm run css:check
      - run: npm run extensions:check
      - run: node --test mcp-worker/src/superProductivitySync.node-test.ts
      - run: node --check integrations/super-productivity-navopath/plugin.js
      - run: npm run build:navopath -- --base=./
      - run: npm run size:check
