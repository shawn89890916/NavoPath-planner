name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changelog
        run: node scripts/changelog-maintain.mjs --check

      - name: Check desktop release policy and tag
        shell: pwsh
        run: |
          node scripts/prepare-desktop-release.mjs --check-policy
          if ($LASTEXITCODE -ne 0) { throw "Desktop release policy validation failed" }
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version"
          }
          if ($env:GITHUB_REF_TYPE -ne "tag" -and ($env:GITHUB_EVENT_NAME -ne "workflow_dispatch" -or $env:GITHUB_REF_NAME -ne "desktop-beta" -or $version -notmatch '-beta\.\d+$')) {
            throw "Manual untagged releases must use desktop-beta and a new Beta version"
          }

      - name: Verify product tests and CSS
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run css:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run extensions:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test mcp-worker/src/superProductivitySync.node-test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check integrations/super-productivity-navopath/plugin.js

      - name: Verify native Chromium Metrics storage
        run: node scripts/metrics-storage-browser.cjs

      - name: Build desktop release
        run: npm run dist

      - name: Publish desktop release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $assets = @(
            "D:/navopath-build/latest.yml",
            "D:/navopath-build/beta.yml",
            "D:/navopath-build/NavoPath-Setup.exe",
            "D:/navopath-build/NavoPath-Setup.exe.blockmap",
            "D:/navopath-build/NavoPath-Portable.exe"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Required desktop release asset is missing: $asset"
            }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Published versions and assets must not be overwritten."
          }

          $isBeta = $version -match '-beta\.\d+$'
          $label = $version -replace '-beta\.', ' Beta '
          $createFlags = @("--draft", "--title", "NavoPath $label")
          if ($isBeta) { $createFlags += "--prerelease" }
          # Only explicit manual runs from desktop-beta may create a tag.
          if ($env:GITHUB_REF_TYPE -ne "tag") {
            $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not verify release tag" }
            if ($remoteTag) { throw "Tag $tag already exists; use a new version" }
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Creating release tag failed" }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Publishing release tag failed" }
          }
          gh release create $tag @assets --verify-tag @createFlags
          if ($LASTEXITCODE -ne 0) { throw "Creating the desktop draft release failed" }
          if ($isBeta) {
            gh release edit $tag --draft=false --prerelease --latest=false
          } else {
            gh release edit $tag --draft=false --latest=true
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the desktop release failed" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published desktop release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/verify-release.mjs "v$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
