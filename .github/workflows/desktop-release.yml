name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changelog
        run: node scripts/changelog-maintain.mjs --check

      - name: Check desktop release policy and tag
        shell: pwsh
        run: |
          node scripts/prepare-desktop-release.mjs --check-policy
          if ($LASTEXITCODE -ne 0) { throw "Desktop release policy validation failed" }
          $version = node -p "require('./package.json').version"
          $isBeta = $version -match '-beta\.\d+$'
          $approvedStableVersions = @("1.6.0", "1.6.3")
          if (-not $isBeta -and $version -notin $approvedStableVersions) {
            throw "Stable release $version is not in the explicitly approved version list: $($approvedStableVersions -join ', ')"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version"
          }

      - name: Build desktop release
        run: npm run dist

      - name: Publish desktop release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $assets = @(
            "D:/navopath-build/latest.yml",
            "D:/navopath-build/beta.yml",
            "D:/navopath-build/NavoPath-Setup.exe",
            "D:/navopath-build/NavoPath-Setup.exe.blockmap",
            "D:/navopath-build/NavoPath-Portable.exe"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Required desktop release asset is missing: $asset"
            }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Published versions and assets must not be overwritten."
          }

          $isBeta = $version -match '-beta\.\d+$'
          $label = $version -replace '-beta\.\d+$', ' Beta'
          $createFlags = @("--draft", "--title", "NavoPath $label")
          if ($isBeta) { $createFlags += "--prerelease" }
          gh release create $tag @assets --verify-tag @createFlags
          if ($LASTEXITCODE -ne 0) { throw "Creating the desktop draft release failed" }
          if ($isBeta) {
            gh release edit $tag --draft=false --prerelease --latest=false
          } else {
            gh release edit $tag --draft=false --latest=true
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the desktop release failed" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published desktop release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/verify-release.mjs "v$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

