<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>NavoPath Dock</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    button { display: block; padding: 0; width: 100%; height: 100%; border: 0;
      background: linear-gradient(to right, #584d3d 0 3px, transparent 3px);
      opacity: .48; cursor: pointer; touch-action: none;
      mask-image: linear-gradient(to bottom, transparent, #000 12px, #000 calc(100% - 12px), transparent);
      transition: opacity 140ms ease; }
    html[data-side="right"] button { background: linear-gradient(to left, #584d3d 0 3px, transparent 3px); }
    button:hover, button:focus-visible { opacity: .72; outline: none; }
    button:active { cursor: ns-resize; }
    @media (prefers-color-scheme: dark) {
      button { background: linear-gradient(to right, #d9d6cf 0 3px, transparent 3px); opacity: .38; }
      html[data-side="right"] button { background: linear-gradient(to left, #d9d6cf 0 3px, transparent 3px); }
      button:hover, button:focus-visible { opacity: .65; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body><button aria-label="Open NavoPath Dock" title="NavoPath · Hover or click to open · Drag to move"></button></body>
</html>
